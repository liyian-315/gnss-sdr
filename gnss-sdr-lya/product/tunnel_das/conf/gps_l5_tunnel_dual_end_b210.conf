; GPS L5 隧道 DAS 双端覆盖测量与功率配平工具 v1
; USRP B210 + 单接收天线，20 Msps。隧道 A/B 两端同时转发同一颗 L5 卫星。
;
; 现场只需要改下面两个区块，其余内容不要动。

; ============================================================================
; ===== 施工人员每次移动测点必改 =============================================
; ============================================================================

Tunnel.enable=true

; 隧道全长（米）
Tunnel.length_m=1000
; 当前接收机距 A 端的距离（米）。换测点只需要改这一行。
Tunnel.measurement_position_m=300

Tunnel.end_a_name=END_A
Tunnel.end_b_name=END_B

; 各端从信源到天线口的固定链路延迟，折算成米（馈线 + 放大器 + 数字链路）。
; 两端不假定相等。未标定时保持 0，此时若 identity 长期 UNKNOWN 且
; TUNNEL_DAS_STATUS 里的 identity_error_m 稳定偏大，差值就约等于这里要填的补偿量。
Tunnel.end_a_fixed_delay_m=0
Tunnel.end_b_fixed_delay_m=0

; 身份判定门限。PROVISIONAL：尚未经过现场标定，勿当作已验证指标。
Tunnel.identity_max_error_m=75
Tunnel.identity_margin_m=50
Tunnel.identity_confirm_epochs=5

; ============================================================================
; ===== 每次进场设备参数（换星/换设备才改）===================================
; ============================================================================

; 目标 PRN：两个通道必须填同一颗
Channel0.satellite=18
Channel1.satellite=18

SignalSource.device_serial=30F4100
SignalSource.gain=60.0
SignalSource.antenna=RX2

; ============================================================================
; ===== 以下为固定接收机参数，现场不要修改 ===================================
; ============================================================================

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=20000000
ControlThread.wait_for_flowgraph=false

SignalSource.implementation=UHD_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=20000000
SignalSource.freq=1176450000
SignalSource.IF_bandwidth_hz=20000000
SignalSource.subdevice=A:A
SignalSource.samples=0
SignalSource.dump=false
SignalSource.enable_throttle_control=false

SignalConditioner.implementation=Pass_Through
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through

Channels_L5.count=2
Channels_L5.signal_paths=2
Channels.in_acquisition=2
Channel.signal=L5
Channel0.signal_path=0
Channel1.signal_path=1

Acquisition_L5.implementation=GPS_L5i_PCPS_Acquisition
Acquisition_L5.item_type=gr_complex
Acquisition_L5.coherent_integration_time_ms=1
Acquisition_L5.pfa=0.001
Acquisition_L5.doppler_max=5000
Acquisition_L5.doppler_step=100
Acquisition_L5.max_dwells=8
Acquisition_L5.bit_transition_flag=false
; Nonblocking acquisition keeps consuming realtime UHD samples.
Acquisition_L5.blocking=false
Acquisition_L5.multipath_detection=true
; v1 只接受捕获面上已经明显分开的两个峰，不声称亚码片分离。
Acquisition_L5.multipath_min_delay_chips=1.25
Acquisition_L5.multipath_max_delay_chips=40.0
Acquisition_L5.multipath_threshold_fraction=0.12
Acquisition_L5.multipath_min_peak_to_noise_db=3.0
Acquisition_L5.multipath_max_power_ratio_db=15.0
Acquisition_L5.multipath_reject_boundary_bins=2
Acquisition_L5.dump=false

Tracking_L5.implementation=GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type=gr_complex
Tracking_L5.track_pilot=true
Tracking_L5.pll_bw_hz=20.0
Tracking_L5.dll_bw_hz=2.0
Tracking_L5.pll_bw_narrow_hz=2.0
Tracking_L5.dll_bw_narrow_hz=0.5
Tracking_L5.order=2
Tracking_L5.early_late_space_chips=0.5
Tracking_L5.extend_correlation_symbols=1
Tracking_L5.enable_fll_pull_in=true
Tracking_L5.fll_bw_hz=10.0
Tracking_L5.pull_in_time_s=4.0
Tracking_L5.carrier_lock_th=0.40
Tracking_L5.cn0_min=12.0
Tracking_L5.max_lock_fail=300
Tracking_L5.max_carrier_lock_fail=20000
Tracking_L5.dump=false
Tracking_L5.dense_correlator_dump=false

TelemetryDecoder_L5.implementation=GPS_L5_Telemetry_Decoder
TelemetryDecoder_L5.dump=false
TelemetryDecoder_L5.dump_mat=false

Observables.implementation=Hybrid_Observables
Observables.stdout=true
Observables.stdout_interval_ms=1000
Observables.dual_path_interval_ms=1000
Observables.dual_path_window_size=15
Observables.dual_path_reliable_confirmations=5
Observables.dual_path_no_second_confirmations=3
Observables.dual_path_lost_confirmations=5
Observables.dual_path_second_path_freshness_limit_s=5.0
Observables.dual_path_max_time_difference_s=0.05
Observables.dual_path_min_primary_cn0_db_hz=20.0
Observables.dual_path_min_second_cn0_db_hz=15.0
Observables.dual_path_max_doppler_difference_hz=500.0
Observables.dual_path_min_abs_delta_m=10.0
Observables.dual_path_max_delta_jump_m=100.0
Observables.dual_path_max_delta_mad_m=25.0
; 本工具不写 CSV，现场结果只走 stdout。
Observables.dual_path_csv=false
Observables.dump=false
Observables.dump_mat=false

; PVT 仍然只消费 Signal_Path=0，第二端不参与定位解算。
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=1000
PVT.dump=false
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false

Monitor.enable_monitor=false
