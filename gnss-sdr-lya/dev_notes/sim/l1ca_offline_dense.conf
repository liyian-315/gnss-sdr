; ============================================================================
; Phase A · GPS L1 C/A single clean path -> dense tracking correlator export
;
; Purpose (dev_notes/11 Phase A):
;   Validate the dense correlator export PHYSICALLY (not just byte-format) on a
;   single clean cabled path from ONE simulator:
;     (3) dense tap@0 chip ~= main-dump Prompt I/Q  -> check_dense_vs_prompt.py
;     (4) averaged |R(tau)| is a smooth symmetric main peak (the reference
;         correlation function template for later two-source fitting)
;
; This is Phase A: ONE simulator, ONE PRN, cabled (+ attenuator), NO combiner.
;
; ---- Recording side (conda env gnsssdr, on the B210 host) -------------------
;   python3 dev_notes/sim/record_b210.py --secs 90 \
;     --freq 1575420000 --rate 4000000 --bw 4000000 \
;     --gain 40 --ant RX2 -o /tmp/l1_phaseA.dat
;   # GPS L1 C/A center = 1575.420 MHz. Cabled+attenuator: start gain ~40 and
;   # lower it until the capture is NOT clipping (check with l5_capstats.py).
;   # Keep --rate == internal_fs_sps below, and use the SAME rate later for the
;   # same-band Phase B so the reference R(tau) stays comparable.
;
; ---- Run (build-conda) ------------------------------------------------------
;   ./build-conda/src/main/gnss-sdr --config_file=dev_notes/sim/l1ca_offline_dense.conf
;
; ---- Analyze ----------------------------------------------------------------
;   # dense profile (single epoch) + smooth-peak sanity:
;   python3 dev_notes/sim/read_dense_correlator_dump.py ./l1_phaseA_dense_ch_0.dat.json \
;       --max 12 --epoch -1 --plot-out l1_phaseA_epoch_last.png
;   # criterion (3)+(4): tap0 vs Prompt cross-check + averaged reference R(tau):
;   python3 dev_notes/sim/check_dense_vs_prompt.py \
;       --dense ./l1_phaseA_dense_ch_0.dat.json \
;       --trk   ./l1_phaseA_trk_ch_0.dat \
;       --ref-out l1_phaseA_reference_Rtau.png
;
; Notes:
;   - SET Channel0.satellite to the GPS PRN your simulator is transmitting.
;   - extend_correlation_symbols=1 on purpose: keeps main-dump Prompt a single
;     1 ms period so it matches dense tap0 1:1 (no 1/N accumulation scaling).
;   - dense_correlator_decimation=1: dump every epoch offline for max averaging.
;   - No iono/tropo, static scenario: keep the reference R(tau) undistorted.
; ============================================================================
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=4000000
ControlThread.wait_for_flowgraph=false

;######### File source: recorded GPS L1 C/A samples #########
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/tmp/l1_phaseA.dat
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=4000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

SignalConditioner.implementation=Pass_Through
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Resampler.sample_freq_in=4000000
Resampler.sample_freq_out=4000000

;######### Single GPS L1 C/A PRN channel #########
Channels_1C.count=1
Channels.in_acquisition=1
Channel.signal=1C
; >>> SET this to the PRN your simulator transmits <<<
Channel0.satellite=1

;######### Acquisition: plain GPS L1 C/A (single path, no second-peak needed) #########
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250
Acquisition_1C.max_dwells=1
Acquisition_1C.bit_transition_flag=false
Acquisition_1C.blocking=true
Acquisition_1C.dump=false

;######### Tracking: standard DLL/PLL + dense correlator export #########
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.track_pilot=false
Tracking_1C.pll_bw_hz=30.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.pll_bw_narrow_hz=20.0
Tracking_1C.dll_bw_narrow_hz=1.5
Tracking_1C.order=3
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.extend_correlation_symbols=1
; main tracking dump (for tap0-vs-Prompt cross-check)
Tracking_1C.dump=true
Tracking_1C.dump_mat=true
Tracking_1C.dump_filename=./l1_phaseA_trk_ch_
; dense correlator export (the instrument under validation)
Tracking_1C.dense_correlator_dump=true
Tracking_1C.dense_correlator_dump_filename=./l1_phaseA_dense_ch_
Tracking_1C.dense_correlator_taps_chips=-1.5:0.1:1.5
Tracking_1C.dense_correlator_decimation=1

TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false
TelemetryDecoder_1C.dump_mat=false

Observables.implementation=Hybrid_Observables
Observables.stdout=true
Observables.stdout_interval_ms=1000
Observables.dump=false
Observables.dump_filename=./l1_phaseA_observables.dat

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=OFF
PVT.trop_model=OFF
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.dump=false
PVT.dump_filename=./l1_phaseA_PVT
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
