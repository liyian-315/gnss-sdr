; ============================================================================
; BeiDou B1I realtime configuration for USRP B210.
;
; Build:
;   cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_UNIT_TESTING=OFF
;   cmake --build build --target gnss-sdr -j"$(nproc)"
;
; Check B210:
;   uhd_find_devices
;   uhd_usrp_probe
;
; Run:
;   GLOG_logtostderr=1 ./build/src/main/gnss-sdr \
;       --config_file=dev_notes/sim/my_bds_b1c_multipath.conf 2>&1 | tee b1i_b210_run.log
;
; What this file does:
;   - Captures B1I directly from a USRP B210 via UHD_Signal_Source.
;   - Uses B1 internally, the native BeiDou B1I signal id in this tree.
;   - Starts with one path per BeiDou B1I PRN so B210 RF and B1I baseband can
;     be validated before enabling the experimental two-path mode.
; ============================================================================
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]

GNSS-SDR.internal_fs_sps=4000000

ControlThread.wait_for_flowgraph=false

;######### SIGNAL SOURCE: USRP B210 #########
SignalSource.implementation=UHD_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=4000000
SignalSource.freq=1561098000
SignalSource.gain=50
SignalSource.subdevice=A:A
SignalSource.antenna=RX2
SignalSource.samples=0
SignalSource.dump=false
SignalSource.enable_throttle_control=false

;######### SIGNAL CONDITIONER #########
SignalConditioner.implementation=Pass_Through
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Resampler.sample_freq_in=4000000
Resampler.sample_freq_out=4000000

;######### CHANNELS #########
Channels_B1.count=4
Channels.in_acquisition=1
Channel.signal=B1

;######### ACQUISITION WITH MULTIPATH DETECTION #########
Acquisition_B1.implementation=BEIDOU_B1I_PCPS_Acquisition
Acquisition_B1.item_type=gr_complex
Acquisition_B1.coherent_integration_time_ms=1
Acquisition_B1.pfa=0.001
Acquisition_B1.doppler_max=5000
Acquisition_B1.doppler_step=250
Acquisition_B1.max_dwells=2
Acquisition_B1.bit_transition_flag=false
Acquisition_B1.blocking=true

Acquisition_B1.multipath_detection=true
Acquisition_B1.multipath_max_delay_chips=5
Acquisition_B1.multipath_threshold_fraction=0.25

Acquisition_B1.dump=false
Acquisition_B1.dump_channel=0
Acquisition_B1.dump_filename=./bds_b1i_acq

;######### TRACKING #########
Tracking_B1.implementation=BEIDOU_B1I_DLL_PLL_Tracking
Tracking_B1.item_type=gr_complex
Tracking_B1.early_late_space_chips=0.5
Tracking_B1.very_early_late_space_chips=0.6
Tracking_B1.pll_bw_hz=35.0
Tracking_B1.dll_bw_hz=2.0
Tracking_B1.fll_bw_hz=10.0
Tracking_B1.enable_fll_pull_in=true
Tracking_B1.enable_fll_steady_state=false
Tracking_B1.pull_in_time_s=5
Tracking_B1.extend_correlation_symbols=1
Tracking_B1.early_late_space_narrow_chips=0.1
Tracking_B1.cn0_min=25
Tracking_B1.max_lock_fail=50
Tracking_B1.carrier_lock_th=0.85
Tracking_B1.dump=false
Tracking_B1.dump_mat=false
Tracking_B1.dump_filename=./bds_b1i_tracking_ch_

;######### TELEMETRY DECODER #########
TelemetryDecoder_B1.implementation=BEIDOU_B1I_Telemetry_Decoder
TelemetryDecoder_B1.dump=false

;######### OBSERVABLES #########
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./bds_b1i_observables.dat

;######### PVT #########
; PVT consumes only Signal_Path=0. Reflected path data stays available in dumps
; and monitor output but is not fed as an extra satellite observation to RTKLIB.
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.dump=false
PVT.dump_filename=./bds_b1i_PVT
PVT.nmea_dump_filename=./bds_b1i_pvt.nmea
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false

;######### MONITOR #########
Monitor.enable_monitor=true
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1234
