; ============================================================================
; BeiDou B1C two-path realtime configuration for USRP B210.
;
; Build:
;   cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_UNIT_TESTING=OFF
;   cmake --build build --target gnss-sdr -j"$(nproc)"
;
; Check B210:
;   uhd_find_devices
;   uhd_usrp_probe
;
; Run:
;   GLOG_logtostderr=1 ./build/src/main/gnss-sdr \
;       --config_file=dev_notes/sim/my_bds_b1c_multipath.conf 2>&1 | tee b1c_b210_run.log
;
; What this file does:
;   - Captures B1C directly from a USRP B210 via UHD_Signal_Source.
;   - Uses C1 internally because Gnss_Synchro.Signal is a 2-char field.
;   - Creates two signal paths per BeiDou B1C PRN. path 0 tracks the strongest
;     acquisition peak, path 1 tracks the strongest accepted neighboring peak.
;   - Dumps acquisition, tracking, observables, and monitor data for analysis.
;
; Current limitation:
;   B1C acquisition and tracking are wired in this tree. Native B1C CNAV1
;   telemetry decoding is still not implemented, so true TOW-backed pseudorange
;   and PVT may remain invalid until the decoder is added.
; ============================================================================
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]

GNSS-SDR.internal_fs_sps=4000000

ControlThread.wait_for_flowgraph=false

;######### SIGNAL SOURCE: USRP B210 #########
SignalSource.implementation=UHD_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=4000000
SignalSource.freq=1575420000
SignalSource.gain=50
SignalSource.subdevice=A:A
SignalSource.antenna=RX2
SignalSource.samples=0
SignalSource.dump=false
SignalSource.enable_throttle_control=false

;######### SIGNAL CONDITIONER #########
SignalConditioner.implementation=Pass_Through
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Resampler.sample_freq_in=4000000
Resampler.sample_freq_out=4000000

;######### CHANNELS #########
; 12 PRNs x 2 paths = 24 channels.
Channels_C1.count=24
Channels_C1.signal_paths=2
Channels.in_acquisition=24
Channel.signal=C1

;######### ACQUISITION WITH MULTIPATH DETECTION #########
Acquisition_C1.implementation=BEIDOU_B1C_PCPS_Acquisition
Acquisition_C1.item_type=gr_complex
Acquisition_C1.coherent_integration_time_ms=10
Acquisition_C1.pfa=0.008
Acquisition_C1.doppler_max=10000
Acquisition_C1.doppler_step=250
Acquisition_C1.max_dwells=3
Acquisition_C1.bit_transition_flag=false
Acquisition_C1.acquire_pilot=true
Acquisition_C1.blocking=false

; path 0 takes the main peak; path 1 automatically takes the accepted second peak.
Acquisition_C1.multipath_detection=true
Acquisition_C1.multipath_max_delay_chips=5
Acquisition_C1.multipath_threshold_fraction=0.25

Acquisition_C1.dump=true
Acquisition_C1.dump_channel=0
Acquisition_C1.dump_filename=./bds_b1c_acq

;######### TRACKING #########
Tracking_C1.implementation=BEIDOU_B1C_DLL_PLL_Tracking
Tracking_C1.item_type=gr_complex
Tracking_C1.track_pilot=true
Tracking_C1.early_late_space_chips=0.15
Tracking_C1.very_early_late_space_chips=0.6
Tracking_C1.pll_bw_hz=25.0
Tracking_C1.dll_bw_hz=2.5
Tracking_C1.pll_bw_narrow_hz=15.0
Tracking_C1.dll_bw_narrow_hz=1.5
Tracking_C1.extend_correlation_symbols=1
Tracking_C1.dump=true
Tracking_C1.dump_filename=./bds_b1c_tracking_ch_

;######### TELEMETRY DECODER #########
; Temporary placeholder: keeps the standard channel chain buildable.
; Native B1C CNAV1 telemetry decoding is still required for valid B1C TOW/PVT.
TelemetryDecoder_C1.implementation=GPS_L1_CA_Telemetry_Decoder

;######### OBSERVABLES #########
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=./bds_b1c_observables.dat

;######### PVT #########
; PVT consumes only Signal_Path=0. Reflected path data stays available in dumps
; and monitor output but is not fed as an extra satellite observation to RTKLIB.
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.dump=false
PVT.dump_filename=./bds_b1c_PVT
PVT.nmea_dump_filename=./bds_b1c_pvt.nmea
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false

;######### MONITOR #########
Monitor.enable_monitor=true
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1234
