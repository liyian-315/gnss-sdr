; ============================================================================
;  BeiDou B1I 双路径跟踪 —— 对指定卫星同时跟踪 直射+反射 两条径
;  用法：先用 bds_b1i_multipath.conf 扫出哪些卫星有多径，再用本配置对它们成对跟踪。
;  原理：两个通道固定到同一 PRN，偶数通道跟主峰(直射)，奇数通道 acquire_second_path 跟第二峰(反射)。
;        固定通道可同 PRN（零改 flowgraph，见 dev_notes/05）。每通道各出一路观测量。
;  ⚠️ 两条径的伪距同时进 PVT 会在 RTKLIB 同 PRN 处冲突（Stage 3 待做）；本配置先验证"双径各自跟踪"。
;  用法见 dev_notes/USAGE.md
; ============================================================================
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=25000000
ControlThread.wait_for_flowgraph=false

;######### 信号源（同 bds_b1i_multipath.conf，改成你的数据） #########
SignalSource.implementation=File_Signal_Source
;★ 改这里：数据文件
SignalSource.filename=/mnt/d/work/data/your_bds_b1i_capture.dat
;★ 改这里：格式
SignalSource.item_type=byte
;★ 改这里：采样率
SignalSource.sampling_frequency=25000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

;######### 信号调理（同 multipath 配置，按你的数据改） #########
; ⚠️ DataTypeAdapter 必须与 item_type 匹配：byte→Byte_To_Short, ishort→Ishort_To_Complex, gr_complex→Pass_Through
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Byte_To_Short
InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=short
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.70
InputFilter.band2_begin=0.80
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=25000000
;★ 改这里：中频（基带填0）
InputFilter.IF=6250000
Resampler.implementation=Pass_Through

;######### 通道：成对固定到同一 PRN #########
; 每 2 个通道跟一颗星：偶数=直射，奇数=反射。要跟 N 颗星就配 2N 个通道。
Channels_B1.count=2
Channels.in_acquisition=2
Channel.signal=B1
;★ 改这里：要成对跟踪的卫星 PRN（两个通道填同一个）
Channel0.satellite=6
Channel1.satellite=6
; 若要再加一颗(如PRN8)：Channels_B1.count=4; Channel2.satellite=8; Channel3.satellite=8;
;                        并复制一份 Acquisition_B13 块(见下)对应通道3

;######### 通道0(共享role)：主峰 → 直射 #########
Acquisition_B1.implementation=BEIDOU_B1I_PCPS_Acquisition
Acquisition_B1.item_type=gr_complex
Acquisition_B1.coherent_integration_time_ms=1
Acquisition_B1.pfa=0.008
Acquisition_B1.doppler_max=10000
Acquisition_B1.doppler_step=250
Acquisition_B1.max_dwells=3
Acquisition_B1.dump=true
Acquisition_B1.dump_channel=0
Acquisition_B1.dump_filename=./bds_b1i_dp_acq
Acquisition_B1.blocking=false

;######### 通道1(per-channel role Acquisition_B1 1，须写全参数)：第二峰 → 反射 #########
Acquisition_B11.implementation=BEIDOU_B1I_PCPS_Acquisition
Acquisition_B11.item_type=gr_complex
Acquisition_B11.coherent_integration_time_ms=1
Acquisition_B11.pfa=0.008
Acquisition_B11.doppler_max=10000
Acquisition_B11.doppler_step=250
Acquisition_B11.max_dwells=3
Acquisition_B11.multipath_max_delay_chips=5
Acquisition_B11.multipath_threshold_fraction=0.25
Acquisition_B11.acquire_second_path=true
Acquisition_B11.dump=true
Acquisition_B11.dump_channel=1
Acquisition_B11.dump_filename=./bds_b1i_dp_acq
Acquisition_B11.blocking=false

;######### 跟踪 / 电文 / 观测 / PVT #########
Tracking_B1.implementation=BEIDOU_B1I_DLL_PLL_Tracking
Tracking_B1.item_type=gr_complex
Tracking_B1.pll_bw_hz=25.0
Tracking_B1.dll_bw_hz=2.5
Tracking_B1.dump=true
Tracking_B1.dump_filename=./bds_b1i_dp_trk

TelemetryDecoder_B1.implementation=BEIDOU_B1I_Telemetry_Decoder
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=./observables_dp.dat
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.dump=true
PVT.dump_filename=./PVT_dp
