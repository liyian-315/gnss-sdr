; ============================================================================
; GPS L5I dual-path tracking prototype, PRN18, file source.
;
; Purpose:
;   Minimal Stage-2 prototype for tracking the strongest path and the second
;   acquisition peak at the same time. Channel0 tracks Signal_Path=0 (primary),
;   Channel1 tracks Signal_Path=1 (second path). PVT still consumes only
;   Signal_Path=0 in rtklib_pvt_gs.cc.
;
; Record first, for example:
;   python3 dev_notes/sim/record_b210.py --secs 30 --gain 76 --ant RX2 \
;     --device-args serial=30F4100 --freq 1176450000 --rate 10000000 \
;     -o /tmp/gps_l5_prn18_twopath.dat
;
; Run:
;   ./build-conda/src/main/gnss-sdr --config_file=dev_notes/sim/l5_dualpath_prn18.conf
;   python3 dev_notes/sim/read_observables_dump.py gps_l5_dualpath_observables.dat \
;     --channels 2 --tail 50 --pairs
;
; Notes:
;   - Change SignalSource.filename and Channel*.satellite for another recording.
;   - Observables.dump_extended=true appends Signal_Path and CN0_dB_hz to the
;     binary dump, so the reader can label primary/second and show C/N0.
; ============================================================================
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=10000000
ControlThread.wait_for_flowgraph=false

;######### File source: recorded GPS L5 samples #########
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/tmp/gps_l5_prn18_twopath.dat
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=10000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

SignalConditioner.implementation=Pass_Through
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Resampler.sample_freq_in=10000000
Resampler.sample_freq_out=10000000

;######### Two channels for one GPS L5 PRN #########
Channels_L5.count=2
Channels_L5.signal_paths=2
Channels.in_acquisition=1
Channel.signal=L5
Channel0.satellite=18
Channel0.signal_path=0
Channel1.satellite=18
Channel1.signal_path=1

;######### Acquisition: path 1 automatically hands the second peak to tracking #########
Acquisition_L5.implementation=GPS_L5i_PCPS_Acquisition
Acquisition_L5.item_type=gr_complex
Acquisition_L5.coherent_integration_time_ms=1
Acquisition_L5.pfa=0.001
Acquisition_L5.doppler_max=5000
Acquisition_L5.doppler_step=250
Acquisition_L5.max_dwells=10
Acquisition_L5.bit_transition_flag=false
Acquisition_L5.blocking=true
Acquisition_L5.multipath_detection=true
Acquisition_L5.multipath_max_delay_chips=90
Acquisition_L5.multipath_threshold_fraction=0.25
Acquisition_L5.dump=false
Acquisition_L5.dump_channel=0
Acquisition_L5.dump_filename=./gps_l5_dualpath_acq

;######### Tracking #########
Tracking_L5.implementation=GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type=gr_complex
Tracking_L5.track_pilot=true
Tracking_L5.pll_bw_hz=15.0
Tracking_L5.dll_bw_hz=2.0
Tracking_L5.pll_bw_narrow_hz=4.0
Tracking_L5.dll_bw_narrow_hz=1.0
Tracking_L5.order=2
Tracking_L5.early_late_space_chips=0.5
Tracking_L5.extend_correlation_symbols=1
Tracking_L5.dump=false
Tracking_L5.dump_filename=./gps_l5_dualpath_tracking_ch_

TelemetryDecoder_L5.implementation=GPS_L5_Telemetry_Decoder
TelemetryDecoder_L5.dump=false
TelemetryDecoder_L5.dump_mat=false

;######### Observables: extended dump has path label and C/N0 #########
Observables.implementation=Hybrid_Observables
Observables.stdout=true
Observables.stdout_interval_ms=1000
Observables.dump=true
Observables.dump_extended=true
Observables.dump_filename=./gps_l5_dualpath_observables.dat

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.dump=false
PVT.dump_filename=./gps_l5_dualpath_PVT
PVT.flag_nmea_tty_port=false
PVT.flag_rtcm_server=false
