; GPS L1 C/A 单星仿真冒烟测试 —— 验证内置 Signal_Generator 注册成功 + 捕获能 dump
; 由 dev_notes 改造项目使用；从本文件所在目录运行 gnss-sdr，dump 落在当前目录
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=4000000

;######### SIGNAL SOURCE：内置信号发生器（我们新注册的 Signal_Generator 实现） #########
SignalSource.implementation=Signal_Generator
SignalSource.item_type=gr_complex
SignalSource.fs_hz=4000000
SignalSource.num_satellites=1
; 第 0 颗：GPS(G) L1 C/A(1C) PRN1，CN0=45dB，多普勒 1500Hz，码延时 355 chips
SignalSource.system_0=G
SignalSource.signal_0=1C
SignalSource.PRN_0=1
SignalSource.CN0_dB_0=50
SignalSource.doppler_Hz_0=1500
SignalSource.delay_chips_0=355
SignalSource.noise_flag=true
SignalSource.data_flag=false
SignalSource.dump=false

;######### SIGNAL CONDITIONER：发生器已是基带复信号，直通即可 #########
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through

;######### CHANNELS：固定到 PRN1，确保捕获我们生成的那颗 #########
Channels_1C.count=1
Channels.in_acquisition=1
Channel.signal=1C
Channel0.satellite=1

;######### ACQUISITION：开 dump，导出二维相关面到 ./gpsl1_acq*.mat #########
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250
Acquisition_1C.max_dwells=10
; 单径也开第二峰检测，用于对照(应得到高 peak_ratio = 无真实第二径)
Acquisition_1C.multipath_detection=true
Acquisition_1C.multipath_max_delay_chips=10
Acquisition_1C.multipath_threshold_fraction=0.2
Acquisition_1C.dump=true
Acquisition_1C.dump_filename=./gpsl1_acq
Acquisition_1C.blocking=false

;######### TRACKING #########
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=4.0
Tracking_1C.dump=false

;######### TELEMETRY / OBSERVABLES / PVT（data_flag=false 无电文，PVT 不出解，正常） #########
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
Observables.implementation=Hybrid_Observables
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
