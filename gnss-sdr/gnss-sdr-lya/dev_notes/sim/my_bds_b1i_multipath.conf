; ============================================================================
; BeiDou B1I multipath survey configuration for Ubuntu.
;
; Run from this directory after building GNSS-SDR:
;   cd dev_notes/sim
;   GLOG_logtostderr=1 ../../build/src/main/gnss-sdr \
;       --config_file=./my_bds_b1i_multipath.conf 2>&1 | tee run_multipath.log
;
; Put your B1I capture beside this file as:
;   ./bds_b1i_capture.dat
;
; If your file format, sampling rate, or IF differs, edit the marked lines below.
; This receiver is for BeiDou B1I. The current tree does not provide a B1C chain.
; ============================================================================
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]

; Change if your capture was sampled at a different rate.
GNSS-SDR.internal_fs_sps=25000000

ControlThread.wait_for_flowgraph=false

;######### SIGNAL SOURCE #########
SignalSource.implementation=File_Signal_Source
; Change this path if you keep the capture elsewhere.
SignalSource.filename=./bds_b1i_capture.dat
; Common values: byte, ibyte, ishort, gr_complex, short.
SignalSource.item_type=byte
SignalSource.sampling_frequency=25000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false
SignalSource.dump=false

;######### SIGNAL CONDITIONER #########
SignalConditioner.implementation=Signal_Conditioner

; For real IF byte samples: byte -> short -> frequency translating FIR.
; For complex baseband USRP captures, typical changes are:
;   SignalSource.item_type=ishort
;   DataTypeAdapter.implementation=Ishort_To_Complex
;   InputFilter.implementation=Pass_Through
;   InputFilter.IF=0
DataTypeAdapter.implementation=Byte_To_Short

InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=short
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.70
InputFilter.band2_begin=0.80
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=25000000
; Change to your capture IF. Use 0 for complex baseband.
InputFilter.IF=6250000
InputFilter.dump=false

Resampler.implementation=Pass_Through
Resampler.sample_freq_in=25000000
Resampler.sample_freq_out=25000000
Resampler.item_type=gr_complex

;######### CHANNELS #########
Channels_B1.count=12
Channels.in_acquisition=12
Channel.signal=B1
; No fixed ChannelN.satellite entries: search the BeiDou B1I PRN pool.

;######### ACQUISITION WITH MULTIPATH DETECTION #########
Acquisition_B1.implementation=BEIDOU_B1I_PCPS_Acquisition
Acquisition_B1.item_type=gr_complex
Acquisition_B1.coherent_integration_time_ms=1
Acquisition_B1.pfa=0.008
Acquisition_B1.doppler_max=10000
Acquisition_B1.doppler_step=250
Acquisition_B1.max_dwells=3

Acquisition_B1.multipath_detection=true
Acquisition_B1.multipath_max_delay_chips=5
Acquisition_B1.multipath_threshold_fraction=0.25

; Correlation surface dump is only for dump_channel, but MULTIPATH logs cover all channels.
Acquisition_B1.dump=true
Acquisition_B1.dump_channel=0
Acquisition_B1.dump_filename=./bds_b1i_acq
Acquisition_B1.blocking=false

;######### TRACKING / TELEMETRY / OBSERVABLES / PVT #########
Tracking_B1.implementation=BEIDOU_B1I_DLL_PLL_Tracking
Tracking_B1.item_type=gr_complex
Tracking_B1.pll_bw_hz=25.0
Tracking_B1.dll_bw_hz=2.5
Tracking_B1.dump=false

TelemetryDecoder_B1.implementation=BEIDOU_B1I_Telemetry_Decoder
TelemetryDecoder_B1.dump=false

Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=./observables.dat

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.rinex_output_enabled=true
PVT.dump=true
PVT.dump_filename=./PVT
