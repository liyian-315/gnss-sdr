; GPS L1 双通道-双径：通道0 跟直射(主峰)，通道1 跟反射(第二峰) —— Stage 1b 验证
; 两通道都固定到 PRN1（agent 证实固定通道可同 PRN），in_acquisition=2 允许并发捕获
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=4000000

;######### 信号源：同 PRN1 的直射+反射双径 #########
SignalSource.implementation=Signal_Generator
SignalSource.item_type=gr_complex
SignalSource.fs_hz=4000000
SignalSource.num_satellites=2
SignalSource.system_0=G
SignalSource.signal_0=1C
SignalSource.PRN_0=1
SignalSource.CN0_dB_0=50
SignalSource.doppler_Hz_0=1500
SignalSource.delay_chips_0=355
SignalSource.system_1=G
SignalSource.signal_1=1C
SignalSource.PRN_1=1
SignalSource.CN0_dB_1=45
SignalSource.doppler_Hz_1=1500
SignalSource.delay_chips_1=361
SignalSource.noise_flag=true
SignalSource.data_flag=false

SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through

;######### 两个通道，都固定 PRN1，并发捕获 #########
Channels_1C.count=2
Channels.in_acquisition=2
Channel.signal=1C
Channel0.satellite=1
Channel1.satellite=1

;######### 通道0 捕获(共享 role)：报告主峰 → 跟直射 #########
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250
Acquisition_1C.max_dwells=10
Acquisition_1C.dump=true
Acquisition_1C.dump_channel=0
Acquisition_1C.dump_filename=./ch_acq
Acquisition_1C.blocking=false

;######### 通道1 捕获(per-channel role，需写全参数)：acquire_second_path → 跟反射 #########
Acquisition_1C1.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C1.item_type=gr_complex
Acquisition_1C1.pfa=0.01
Acquisition_1C1.doppler_max=5000
Acquisition_1C1.doppler_step=250
Acquisition_1C1.max_dwells=10
Acquisition_1C1.multipath_max_delay_chips=10
Acquisition_1C1.multipath_threshold_fraction=0.2
Acquisition_1C1.acquire_second_path=true
Acquisition_1C1.dump=true
Acquisition_1C1.dump_channel=1
Acquisition_1C1.dump_filename=./ch_acq
Acquisition_1C1.blocking=false

;######### 跟踪/电文/观测/PVT（两通道共享 role） #########
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=4.0

TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=./observables.dat
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
